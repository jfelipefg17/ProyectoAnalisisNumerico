name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install numpy pandas pytest

    - name: Run tests
      run: |
        # Change the path below to run the tests you need
        python DigitalNumbers/tests/chapter2_linear_systems/test_LU_simple.py
        python DigitalNumbers/tests/chapter2_linear_systems/test_LU_partial_pivoting.py
        python DigitalNumbers/tests/chapter2_linear_systems/test_crout.py
        python DigitalNumbers/tests/chapter2_linear_systems/test_doolittle.py
